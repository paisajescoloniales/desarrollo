      button:
        label: "telar"
        nested_id: "panel-1-3-key"
      tertiary:
        id: "panel-1-3-key"
        title: "El telar kogui"
        paragraphs:
          - "Entre los kogi de la Sierra Nevada de Santa Marta, el telar, además de ser un instrumento para hilar sus prendas, es un mapa que representa el cuerpo humano y la geografía de la Sierra."
          - "El torso de un hombre con sus brazos cruzados forma la figura del telar. A su vez, las cuatro esquinas del telar representan las cuatro ciudades de las tierras bajas (Santa Marta, Riohacha, Fundación y Valledupar), mientras las cruces que se forman su interior representan los picos nevados."
          - "La forma del telar crea entonces un marco que sirve a los kogi para conceptualizar y representar la geografía, y este marco también se puede expresar en sus cuerpos."
        image: "/assets/img/1.3.3.1.jpg"
        caption: "Framework of a Kogi loom. En: The Loom of Life: A Kogi Principle of Integration. G. Reichel-Dolmatoff, 1978."
- id: "1-4"
  step: 4
  x: 850
  y: 650
  zoom: 1.4
  question: "¿Quiénes eran los dueños de este terreno?"
  paragraph: >
    La hacienda representada en la pintura perteneció a Francisco de Maldonado y Mendoza. Sus descendientes obtuvieron títulos nobiliarios y la hacienda se convirtió en el centro del Marqués de San Jorge.
  offcanvas:
    id: "panel-1-4"
    title: "El mayorazgo y el linaje de los Maldonado"
    paragraphs:
      - "El juicio ratificó el derecho de Maldonado y Mendoza sobre su hacienda. En su testamento, Maldonado transformó su hacienda en un mayorazgo. Esto significaba que tras su muerte no se dividiría entre sus herederos sino que lo conservaría su primogénito, Antonio Maldonado de Mendoza."
      - "Este es el comienzo de un poderoso linaje que se fortaleció alrededor de la hacienda."
      - "Esta propiedad se ha conocido como la “Dehesa de Bogotá”, el mayorazgo de Bogotá, o el Novillero y se caracterizaba por alojar temporalmente el ganado que venía de tierras bajas para su consumo en la ciudad de Santafé de Bogotá. Los herederos de Maldonado y Mendoza continuaron uniéndose con algunas de las familias más prestantes del Nuevo Reino de Granada, eventualmente recibiendo títulos nobiliarios y erigiéndose en el Marquesado de San Jorge."
      - "Este linaje mantuvo su poder durante dos siglos, incluyendo virreyes y obispos. De hecho, Jorge Tadeo Lozano, el primer presidente de la república en 1811 fue uno de sus descendientes."
    images:
      - src: "/assets/img/def-mayorazgo.png"
        caption: "Tesoro de la lengua castellana, o española. Sebastián de Covarrubias Orozco, 1611. Cortesía de: John P. Robarts Research Library, Toronto."
      - src: "/assets/img/1.5.jpg"
        caption: "Retrato de Antonio Maldonado de Mendoza. Anónimo, siglo XVIII. Cortesía del Museo Colonial, Bogotá."
      - src: "/assets/img/1.5.1.jpg"
        caption: "Libro Segundo de las Genealogías del Nuevo Reyno de Granada. Juan Flórez de Ocáriz, 1674. Cortesía de: John Carter Brown Library, Providence."
      - src: "/assets/img/1.5.2.jpg"
        caption: "Libro Segundo de las Genealogías del Nuevo Reyno de Granada. Juan Flórez de Ocáriz, 1674. Cortesía de: John Carter Brown Library, Providence."
    tertiary:
      id: "panel-1-4-key"
      title: "Jorge Tadeo Lozano"
      paragraphs:
        - "Jorge Tadeo Lozano nació en Bogotá en 1771, estudió en Europa y se interesó por la historia natural. Esto le permitió unirse a la Real Expedición Botánica en la Nueva Granada en 1803 como encargado del proyecto zoológico. Dada su posición social y económica,Lozano contaba con numerosas haciendas en diferentes climas, lo que le facilitó la recolección de animales para iniciar su trabajo. Como resultado escribió La Fauna Cundinamarquesa. También participó en la publicación de “Correo o curioso,erudito, económico y mercantil de la ciudad de Santa Fe de Bogotá”. Su trabajo formó parte de un contexto en el cual la Corona Española buscaba impulsar la economía de las colonias a través de expediciones científicas, que tuvo lugar en el marco de las dinámicas globales de la Ilustración."
        - "Como parte de su trabajo administrativo en el imperio español, Lozano fue nombrado teniente protector de indios en 1807. Con la consolidación del primer gobierno republicano, Lozano sirvió como primer presidente de las Provincias Unidas de la Nueva Granada, solo para ser depuesto en 1811 por un golpe de estado encabezado por Antonio Nariño."
        - "Tras la reconquista, las fuerzas de Pablo Morillo fusilaron a Lozano el 6 de julio de 1816 en la actual Plaza de los Mártires por su participación en la política republicana."
